<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>halo-re</title>
<style>
  :root {
    --blue: #7fb2e5; --blue-bright: #cfe6ff; --blue-dim: #3d6488; --frame: #2a4a6a;
    --font: Bahnschrift, 'DIN Alternate', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--blue); font: 15px var(--font); }
  /* Scale the game's fixed-size drawing buffer up to the viewport, letterboxed to keep its aspect. */
  #canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; outline: none; }

  /* The start and loading screens (placeholder until the game's own loading screen assets are drawn here). */
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; }
  .menu { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 14px; min-height: 90px; }
  #play {
    font: inherit; font-size: 26px; letter-spacing: 0.35em; padding: 6px 0.2em 6px 0.55em; background: none; border: 0; cursor: pointer;
    color: var(--blue); text-shadow: 0 0 10px rgba(110, 170, 240, 0.5); transition: color 0.15s, text-shadow 0.15s;
  }
  #play::before, #play::after { content: ''; display: inline-block; width: 0.9em; opacity: 0; transition: opacity 0.15s; }
  #play::before { content: '\203A'; margin-right: 0.3em; }
  #play::after { content: '\2039'; margin-left: -0.05em; }
  #play:hover:not(:disabled), #play:focus-visible { color: var(--blue-bright); text-shadow: 0 0 16px rgba(140, 200, 255, 0.9); outline: none; }
  #play:hover:not(:disabled)::before, #play:hover:not(:disabled)::after, #play:focus-visible::before, #play:focus-visible::after { opacity: 1; }
  #play:disabled { color: var(--blue-dim); text-shadow: none; cursor: default; }
  #status { font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--blue-dim); min-height: 1.3em; text-align: center; max-width: 90vw; }

  /* Halo-style segmented progress bar: full screen while the game starts, a small panel in the corner later. */
  #loading { display: none; pointer-events: none; }
  #loading.active { display: flex; }
  #loading .panel { position: relative; z-index: 1; width: min(520px, 80vw); }
  #loading .label { display: flex; justify-content: space-between; font-size: 13px; letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 8px; }
  #loading .bar { height: 12px; padding: 3px; border: 1px solid var(--frame); background: rgba(5, 15, 28, 0.7); box-shadow: 0 0 12px rgba(80, 140, 210, 0.15) inset; }
  #loading .fill {
    height: 100%; width: 0; transition: width 0.2s;
    background: repeating-linear-gradient(90deg, var(--blue) 0 9px, transparent 9px 12px);
    filter: drop-shadow(0 0 4px rgba(120, 180, 255, 0.6));
  }
  #loading.corner { inset: auto 16px 16px auto; background: rgba(3, 8, 14, 0.85); border: 1px solid var(--frame); padding: 10px 14px; }
  #loading.corner::after { display: none; }
  #loading.corner .panel { width: 220px; }
  #loading.corner .label { font-size: 11px; letter-spacing: 0.2em; }
  #loading.corner .bar { height: 6px; padding: 2px; }

  #fullscreen {
    position: fixed; top: 12px; right: 14px; display: none; font: inherit; font-size: 12px; letter-spacing: 0.25em; text-transform: uppercase;
    padding: 6px 10px; background: rgba(3, 8, 14, 0.6); color: var(--blue); border: 1px solid var(--frame); cursor: pointer; opacity: 0.55;
  }
  #fullscreen:hover { opacity: 1; color: var(--blue-bright); }
  #fullscreen.shown { display: block; }
  :fullscreen #fullscreen { display: none; }

  #notice { display: none; z-index: 2; text-align: center; padding: 16px; }
  #notice.shown { display: flex; }
  #notice .panel { position: relative; z-index: 1; max-width: 560px; padding: 28px 32px; border: 1px solid var(--frame); background: rgba(3, 8, 14, 0.85); }
  #notice h2 { margin: 0 0 12px; font-weight: 400; font-size: 20px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--blue-bright); }
  #notice p { margin: 0 0 10px; line-height: 1.5; }
  #notice small { display: block; color: var(--blue-dim); overflow-wrap: anywhere; margin-bottom: 16px; }
  #notice button {
    font: inherit; font-size: 15px; letter-spacing: 0.3em; text-transform: uppercase; padding: 8px 20px; cursor: pointer;
    background: none; color: var(--blue); border: 1px solid var(--frame);
  }
  #notice button:hover { color: var(--blue-bright); border-color: var(--blue-dim); }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="start" class="screen">
  <div class="menu">
    <button id="play" disabled>PLAY</button>
    <div id="status">Preparing</div>
  </div>
</div>
<div id="loading" class="screen">
  <div class="panel">
    <div class="label"><span id="loading-text">Loading</span><span id="loading-amount"></span></div>
    <div class="bar"><div class="fill"></div></div>
  </div>
</div>
<button id="fullscreen" title="Fullscreen also hands Ctrl shortcuts to the game (Chrome/Edge)">Fullscreen</button>
<div id="notice" class="screen">
  <div class="panel"><h2 id="notice-title"></h2><p id="notice-text"></p><small id="notice-detail"></small><button id="notice-reload">Reload</button></div>
</div>
<script>
  // Something the visitor can act on instead of a black screen: an unsupported browser, or the game stopping.
  const confirmLeave = (event) => { event.preventDefault(); event.returnValue = ''; };
  const notice = (title, text, detail = '', reload = true) => {
    if (document.getElementById('notice').classList.contains('shown')) return;
    document.getElementById('notice-title').textContent = title;
    document.getElementById('notice-text').textContent = text;
    document.getElementById('notice-detail').textContent = detail;
    document.getElementById('notice-reload').style.display = reload ? '' : 'none';
    document.getElementById('notice').classList.add('shown');
    window.removeEventListener('beforeunload', confirmLeave);
    if (document.pointerLockElement) document.exitPointerLock();
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  };
  document.getElementById('notice-reload').addEventListener('click', () => location.reload());
  const crashed = (detail) => notice('The game stopped unexpectedly', 'Reload the page to start again.', String(detail || '').slice(0, 300));
  const isCrash = (text) => /^Aborted\(|RuntimeError|unreachable executed|memory access out of bounds/.test(String(text));
  window.addEventListener('error', (event) => {
    if (/requires (Chrome|Firefox|Safari)/.test(event.message)) {  // emscripten's own browser version check
      notice('This browser is too old', 'Use a current version of Chrome, Edge or Firefox.', event.message, false);
    } else if (isCrash(event.message) || event.error instanceof WebAssembly.RuntimeError) {
      crashed(event.message);
    }
  });
  const unsupported = () => {
    if (/Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 0 && !matchMedia('(pointer: fine)').matches)) {
      return 'Halo needs a keyboard and mouse: open this page on a desktop or laptop.';
    }
    if (!window.crossOriginIsolated || typeof SharedArrayBuffer === 'undefined' || !('transferControlToOffscreen' in HTMLCanvasElement.prototype)) {
      return 'This browser lacks features the game needs (threads and offscreen rendering). Use a current Chrome, Edge or Firefox.';
    }
    if (!document.createElement('canvas').getContext('webgl2')) {
      return 'WebGL 2 is unavailable: turn on hardware acceleration in your browser settings, or update your graphics drivers.';
    }
    return '';
  };
  // The module starts on a click: browsers only allow sound and pointer lock after one.
  const status = document.getElementById('status');
  const play = document.getElementById('play');
  const problem = unsupported();
  const gameStopped = (message) => {
    if (/profile files/.test(message)) {
      notice("Halo couldn't open its save files",
        'It is probably already open in another tab or window: close it there, then reload. Private or incognito windows ' +
        "can't store save files either.", message);
    } else {
      notice('The game stopped', 'Reload the page to start again.', message);
    }
  };
  var Module = {
    canvas: document.getElementById('canvas'),
    noInitialRun: true,  // main() runs on the click, once the manifest is in
    print: (text) => console.log(text),
    printErr: (text) => {  // workers' aborts and the game's fatal error messages arrive here
      console.warn(text);
      const fatal = /^\[Halo - Fatal Error\] (.*)/.exec(text);
      if (fatal) gameStopped(fatal[1]);  // the game exits right after; its runtime stays up, so onExit may not run
      if (isCrash(text)) crashed(text);
    },
    onAbort: (what) => crashed(what),
    onExit: (code) => { if (code !== 0) gameStopped(`Exit code ${code}`); },
    setStatus: () => {},
  };
  if (problem) {
    notice('Can\'t run here', problem, '', false);
  }
  let ready = 0;  // 1 runtime initialised, 2 manifest loaded: Play needs both
  const enable = () => { if (++ready === 2 && !problem) { status.textContent = ''; play.disabled = false; play.focus(); } };
  Module.onRuntimeInitialized = enable;
  fetch('halo/manifest.json')
    .then((response) => { if (!response.ok) throw new Error(response.status); return response.text(); })
    .then((manifest) => {
      Module.haloManifest = manifest;
      enable();
    })
    .catch(() => { status.textContent = 'Game files unavailable'; });
  // Each start's player identity for the host's duplicate CD key check: fresh random key characters every time, since
  // a duplicated tab copies sessionStorage. Not a product key: nothing here checks one.
  const playerKey = () => {
    const alphabet = 'BCDFGHJKMPQRTVWXY2346789';
    return Array.from(crypto.getRandomValues(new Uint8Array(25)), (byte) => alphabet[byte % alphabet.length]).join('');
  };
  // Loading bar, fed by web/pre.js. The first load's size isn't known up front, so the bar measures against
  // the last completed startup (remembered per browser) or a typical first load.
  const loading = document.getElementById('loading');
  const loadingText = document.getElementById('loading-text');
  const loadingAmount = document.getElementById('loading-amount');
  const loadingFill = loading.querySelector('.fill');
  const mb = (bytes) => (bytes / 1048576).toFixed(0);
  const storedTotal = () => { try { return Number(localStorage.getItem('halo-startup-bytes')) || 0; } catch { return 0; } };
  let expected = storedTotal() || 70 * 1048576;
  let downloaded = 0, cached = 0, firstLoad = true, idleTimer = 0;
  new BroadcastChannel('halo-progress').onmessage = ({ data }) => {
    downloaded += data.downloaded || 0;
    cached += data.cached || 0;
    const total = downloaded + cached;
    loading.classList.add('active');
    loadingText.textContent = downloaded ? 'Downloading' : 'Loading';
    loadingAmount.textContent = firstLoad ? Math.min(99, Math.floor(total / expected * 100)) + '%' : mb(total) + ' MB';
    loadingFill.style.width = firstLoad ? Math.min(99, total / expected * 100) + '%' : '100%';
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {  // quiet for 2 s: this load is done
      if (firstLoad) {
        try { localStorage.setItem('halo-startup-bytes', String(total)); } catch {}
        firstLoad = false;
        loading.classList.add('corner');
      }
      loading.classList.remove('active');
      downloaded = cached = 0;
    }, 2000);
  };
  // Fullscreen locks every key except Esc, so Ctrl+W and friends reach the game (Chrome/Edge) while Esc still frees
  // the mouse. Elsewhere the leave-page prompt catches an accidental close.
  const lockedKeys = [
    ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map((c) => 'Key' + c),
    ...'0123456789'.split('').map((d) => 'Digit' + d),
    ...Array.from({ length: 12 }, (_, i) => 'F' + (i + 1)).filter((f) => f !== 'F11'),
    'Tab', 'Space', 'Enter', 'Backspace', 'Backquote', 'Minus', 'Equal', 'BracketLeft', 'BracketRight', 'Backslash',
    'Semicolon', 'Quote', 'Comma', 'Period', 'Slash', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
    'ControlLeft', 'ControlRight', 'AltLeft', 'AltRight', 'ShiftLeft', 'ShiftRight', 'MetaLeft', 'MetaRight',
  ];
  const fullscreenButton = document.getElementById('fullscreen');
  fullscreenButton.addEventListener('click', async () => {
    try {
      await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
      await navigator.keyboard?.lock?.(lockedKeys);
    } catch {}
    Module.canvas.focus();
  });
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) navigator.keyboard?.unlock?.(); });
  // Only a click on the game captures the mouse. The game's SDL relative mouse mode asks for pointer lock again on
  // the next key press or click after Esc releases it, which would grab the mouse straight back; those requests are
  // ignored, so Esc leaves the mouse free until the player clicks the game.
  const nativeRequestPointerLock = HTMLCanvasElement.prototype.requestPointerLock;
  let pointerLockAllowed = false;
  Module.canvas.requestPointerLock = function (...args) {
    return pointerLockAllowed ? nativeRequestPointerLock.apply(this, args) : Promise.resolve();
  };
  Module.canvas.addEventListener('click', () => {
    pointerLockAllowed = true;
    try { Module.canvas.requestPointerLock()?.catch?.(() => {}); } finally { pointerLockAllowed = false; }
  });
  // Losing the mouse mid-game (Esc, Alt+Tab) presses Esc for the game, so its pause menu opens. A real Esc the game
  // already saw (a browser that delivers it as well) is not doubled.
  let lastRealEscape = 0;
  window.addEventListener('keydown', (event) => { if (event.isTrusted && event.code === 'Escape') lastRealEscape = performance.now(); }, true);
  const pressEscape = () => {
    const key = { key: 'Escape', code: 'Escape', keyCode: 27, which: 27, bubbles: true };
    window.dispatchEvent(new KeyboardEvent('keydown', key));
    setTimeout(() => window.dispatchEvent(new KeyboardEvent('keyup', key)), 100);  // held long enough for a game tick
  };
  document.addEventListener('pointerlockchange', () => {
    const playing = !document.getElementById('start') && !document.getElementById('notice').classList.contains('shown');
    if (!document.pointerLockElement && playing && performance.now() - lastRealEscape > 200) {
      pressEscape();
    }
  });
  // One game per browser: a second copy can't open the profile and save files (browser storage lets one tab have
  // them). The held lock also keeps the browser from freezing this tab while hidden, so a host keeps serving players.
  const takeGameLock = () => new Promise((resolve) => {
    if (!navigator.locks) return resolve(true);
    navigator.locks.request('halo-game', { ifAvailable: true }, (lock) => {
      resolve(lock !== null);
      return lock ? new Promise(() => {}) : undefined;
    });
  });
  play.addEventListener('click', async () => {
    if (!await takeGameLock()) {
      notice('Halo is already open', 'Close Halo in your other tabs or windows, then reload this page.');
      return;
    }
    Module.haloCdKey = playerKey();
    loading.classList.add('active');
    loadingText.textContent = 'Loading';
    loadingAmount.textContent = '';
    document.getElementById('start').remove();
    fullscreenButton.classList.add('shown');
    window.addEventListener('beforeunload', confirmLeave);
    Module.canvas.focus();
    Module.callMain([]);
  });
</script>
