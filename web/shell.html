<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>halo-re</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #9ab; font: 14px system-ui, sans-serif; }
  html, body { overflow: hidden; }
  /* Scale the game's fixed-size drawing buffer up to the viewport, letterboxed to keep its aspect. */
  #canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; outline: none; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  #start button { font: inherit; padding: 10px 28px; background: #234; color: #def; border: 1px solid #456; border-radius: 4px; cursor: pointer; }
  #status { min-height: 1.4em; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="start">
  <div id="status">Halo files are served by tools/serve_web.py from your own install.</div>
  <button id="play" disabled>Play</button>
</div>
<script>
  // The module starts on a click: browsers only allow sound and pointer lock after one.
  const status = document.getElementById('status');
  const play = document.getElementById('play');
  var Module = {
    canvas: document.getElementById('canvas'),
    noInitialRun: true,  // main() runs on the click, once the manifest is in
    print: (text) => console.log(text),
    printErr: (text) => console.warn(text),
    setStatus: (text) => { if (text) status.textContent = text; },
  };
  let ready = 0;  // 1 runtime initialised, 2 manifest loaded: Play needs both
  const enable = () => { if (++ready === 2) { status.textContent = 'Ready.'; play.disabled = false; } };
  Module.onRuntimeInitialized = enable;
  fetch('halo/manifest.json')
    .then((response) => { if (!response.ok) throw new Error(response.status); return response.text(); })
    .then((manifest) => {
      Module.haloManifest = manifest;
      enable();
    })
    .catch(() => { status.textContent = 'No Halo files: start this page through tools/serve_web.py --halo <your Halo folder>.'; });
  // Each start's player identity for the host's duplicate CD key check: fresh random key characters every time, since
  // a duplicated tab copies sessionStorage. Not a product key: nothing here checks one.
  const playerKey = () => {
    const alphabet = 'BCDFGHJKMPQRTVWXY2346789';
    return Array.from(crypto.getRandomValues(new Uint8Array(25)), (byte) => alphabet[byte % alphabet.length]).join('');
  };
  play.addEventListener('click', () => {
    Module.haloCdKey = playerKey();
    document.getElementById('start').remove();
    Module.canvas.focus();
    Module.callMain([]);
  });
  Module.canvas.addEventListener('click', () => Module.canvas.requestPointerLock());
</script>

</body>
</html>
