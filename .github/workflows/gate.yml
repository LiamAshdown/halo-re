name: gate
on:
  push:
    branches: [master]
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang mingw-w64-i686-dev
      - name: Run gate
        run: python3 tools/gate.py
